<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="미션으로 가족과 가까워지는 성남 다문화 아빠 히어로즈">
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
    <title>성남 다문화 아빠 히어로즈</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip" href="#main" data-i18n="app.skip">본문으로 건너뛰기</a>

    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span aria-hidden="true">🦸</span>
                <span data-i18n="app.short">아빠 히어로즈</span>
            </div>
            <div class="top-actions">
                <button class="pill" data-action="open-sheet" data-sheet="language" data-i18n-label="common.language">
                    <span aria-hidden="true">🌐</span>
                    <span id="langLabel">한국어</span>
                </button>
                <button class="icon-btn" data-action="open-sheet" data-sheet="settings" data-i18n-label="common.settings">
                    <span aria-hidden="true">⚙️</span>
                </button>
            </div>
        </header>

        <main id="main" tabindex="-1"></main>

        <nav class="tabbar" data-i18n-label="nav.label">
            <a href="#home" data-tab="home">
                <span class="tab-icon" aria-hidden="true">🏠</span>
                <span data-i18n="nav.home">홈</span>
            </a>
            <a href="#games" data-tab="games">
                <span class="tab-icon" aria-hidden="true">🎮</span>
                <span data-i18n="nav.games">게임</span>
            </a>
            <a href="#diary" data-tab="diary">
                <span class="tab-icon" aria-hidden="true">📔</span>
                <span data-i18n="nav.diary">기록</span>
            </a>
            <a href="#community" data-tab="community">
                <span class="tab-icon" aria-hidden="true">💬</span>
                <span data-i18n="nav.community">커뮤니티</span>
            </a>
            <a href="#progress" data-tab="progress">
                <span class="tab-icon" aria-hidden="true">📊</span>
                <span data-i18n="nav.progress">성장</span>
            </a>
        </nav>
    </div>

    <dialog id="sheet" aria-labelledby="sheetTitle">
        <div class="sheet-head">
            <h2 id="sheetTitle"></h2>
            <button class="icon-btn" data-action="close-sheet" data-i18n-label="common.close">
                <span aria-hidden="true">✕</span>
            </button>
        </div>
        <div id="sheetBody" class="sheet-body"></div>
    </dialog>

    <div id="celebrate" class="celebrate" role="status" data-action="dismiss-celebrate" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>이 앱을 사용하려면 자바스크립트를 켜 주세요. Please enable JavaScript to use this app.</noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
