<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="미션으로 가족과 가까워지는 성남 다문화 아빠 히어로즈">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
    <title>성남 다문화 아빠 히어로즈</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <a class="skip" href="#main" data-i18n="app.skip">본문으로 건너뛰기</a>

    <div class="app">
        <header class="topbar">
            <div class="brand" data-i18n="app.short">아빠 히어로즈</div>
            <div class="top-actions">
                <button class="text-btn" data-action="open-sheet" data-sheet="language" data-i18n-label="common.language">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
                    <span id="langLabel">한국어</span>
                </button>
                <button class="icon-btn" data-action="open-sheet" data-sheet="settings" data-i18n-label="common.settings">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg>
                </button>
            </div>
        </header>

        <main id="main" tabindex="-1"></main>

        <nav class="tabbar" data-i18n-label="nav.label">
            <a href="#home" data-tab="home">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>
                <span data-i18n="nav.home">홈</span>
            </a>
            <a href="#games" data-tab="games">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="3"/><path d="M8 10.5v3M6.5 12h3"/><circle cx="16" cy="12" r="1"/></svg>
                <span data-i18n="nav.games">게임</span>
            </a>
            <a href="#diary" data-tab="diary">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17H6z"/><path d="M9.5 8h5M9.5 12h5M9.5 16h3"/></svg>
                <span data-i18n="nav.diary">기록</span>
            </a>
            <a href="#community" data-tab="community">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
                <span data-i18n="nav.community">커뮤니티</span>
            </a>
            <a href="#progress" data-tab="progress">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>
                <span data-i18n="nav.progress">성장</span>
            </a>
        </nav>
    </div>

    <dialog id="sheet" aria-labelledby="sheetTitle">
        <div class="sheet-head">
            <h2 id="sheetTitle"></h2>
            <button class="icon-btn" data-action="close-sheet" data-i18n-label="common.close">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div id="sheetBody" class="sheet-body"></div>
    </dialog>

    <div id="celebrate" class="celebrate" role="status" data-action="dismiss-celebrate" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>이 앱을 사용하려면 자바스크립트를 켜 주세요. Please enable JavaScript to use this app.</noscript>
    <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
